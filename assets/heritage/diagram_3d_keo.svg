<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="320" rx="16" fill="#FBF9F5"/>
  <!-- Isometric Grid Floor -->
  <g opacity="0.4">
    <path d="M240 280 L400 190 L240 100 L80 190 Z" fill="#F3EDE2" stroke="#DCD3C4" stroke-width="1.5" stroke-dasharray="4 4"/>
    <ellipse cx="240" cy="190" rx="130" ry="70" stroke="#C89547" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <!-- 360 rotation arrows -->
    <path d="M370 190 A130 70 0 0 1 240 260" stroke="#C46238" stroke-width="2" stroke-linecap="round"/>
    <polygon points="242,263 234,260 242,254" fill="#C46238"/>
  </g>
  <!-- 3D Pagoda Isometric Massing -->
  <!-- Base Plinth -->
  <path d="M180 230 L240 260 L300 230 L240 200 Z" fill="#C5BCAB" stroke="#8E8474" stroke-width="2"/>
  <path d="M180 230 L180 240 L240 270 L240 260 Z" fill="#A89E8D" stroke="#8E8474" stroke-width="1.5"/>
  <path d="M240 260 L240 270 L300 240 L300 230 Z" fill="#958B7A" stroke="#8E8474" stroke-width="1.5"/>
  <!-- Tier 1 Columns & Body -->
  <line x1="200" y1="220" x2="200" y2="170" stroke="#7C4C28" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="220" x2="280" y2="170" stroke="#7C4C28" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="240" x2="240" y2="185" stroke="#7C4C28" stroke-width="4" stroke-linecap="round"/>
  <!-- Tier 1 Roof (Curved Eaves) -->
  <path d="M140 175 Q240 190 340 175 L280 150 Q240 158 200 150 Z" fill="#C46238" stroke="#8C3818" stroke-width="2"/>
  <!-- Tier 2 Bracket Systems (Đấu Củng) -->
  <rect x="215" y="135" width="50" height="16" fill="#8E562F" stroke="#5C3418" stroke-width="1.5" rx="2"/>
  <!-- Tier 2 Roof -->
  <path d="M165 140 Q240 152 315 140 L270 120 Q240 126 210 120 Z" fill="#C46238" stroke="#8C3818" stroke-width="2"/>
  <!-- Tier 3 Upper Belvedere & Bell -->
  <rect x="225" y="105" width="30" height="16" fill="#6D4020" rx="2"/>
  <ellipse cx="240" cy="112" rx="5" ry="7" fill="#E5B552" stroke="#9B7520" stroke-width="1"/>
  <!-- Tier 3 Top Curved Roof -->
  <path d="M190 108 Q240 118 290 108 L260 85 Q240 90 220 85 Z" fill="#B04620" stroke="#7A2608" stroke-width="2"/>
  <!-- Finial -->
  <line x1="240" y1="85" x2="240" y2="65" stroke="#C89547" stroke-width="3" stroke-linecap="round"/>
  <circle cx="240" cy="62" r="5" fill="#E5B552" stroke="#9B7520" stroke-width="1.5"/>
  <!-- Interactive Hotspot Markers -->
  <g transform="translate(200, 185)">
    <circle cx="0" cy="0" r="8" fill="#C46238" opacity="0.2"/>
    <circle cx="0" cy="0" r="4" fill="#C46238" stroke="#FFF" stroke-width="1.5"/>
  </g>
  <g transform="translate(275, 130)">
    <circle cx="0" cy="0" r="8" fill="#C89547" opacity="0.2"/>
    <circle cx="0" cy="0" r="4" fill="#C89547" stroke="#FFF" stroke-width="1.5"/>
  </g>
  <g transform="translate(240, 110)">
    <circle cx="0" cy="0" r="8" fill="#435C4B" opacity="0.2"/>
    <circle cx="0" cy="0" r="4" fill="#435C4B" stroke="#FFF" stroke-width="1.5"/>
  </g>
  <!-- Technical Dimension Tags -->
  <text x="320" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#8C887B">12 ĐẦU ĐAO</text>
  <line x1="292" y1="95" x2="315" y2="88" stroke="#BBB2A2" stroke-width="1"/>
  <text x="70" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#8C887B">ĐẤU CỦNG GỖ LIM</text>
  <line x1="160" y1="145" x2="212" y2="142" stroke="#BBB2A2" stroke-width="1"/>
</svg>