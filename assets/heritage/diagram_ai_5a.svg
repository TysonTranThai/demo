  <!-- Output Palette Pills at bottom -->
  <g transform="translate(185, 280)">
    <circle cx="0" cy="0" r="8" fill="#7C4C28" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="24" cy="0" r="8" fill="#C46238" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="48" cy="0" r="8" fill="#C89547" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="72" cy="0" r="8" fill="#435C4B" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="96" cy="0" r="8" fill="#171716" stroke="#FFF" stroke-width="1.5"/>
