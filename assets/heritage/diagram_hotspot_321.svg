<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="320" rx="16" fill="#FBF9F5"/>
  <!-- Left Side: Interactive Photo Plate -->
  <g transform="translate(50, 60)">
    <rect width="170" height="190" rx="12" fill="#FFF" stroke="#E5DFC8" stroke-width="1.5"/>
    <rect x="12" y="12" width="146" height="110" rx="8" fill="#E8E1D3"/>
    <!-- Photographic Lines -->
    <path d="M20 100 Q80 50 150 95 L150 115 L20 115 Z" fill="#C5BCAB" opacity="0.7"/>
    <circle cx="55" cy="45" r="12" fill="#C89547" opacity="0.5"/>
    <!-- Hotspot Pins on photo -->
    <g transform="translate(65, 80)">
      <circle cx="0" cy="0" r="10" fill="#C46238" opacity="0.25"/>
      <circle cx="0" cy="0" r="5" fill="#C46238" stroke="#FFF" stroke-width="2"/>
    </g>
    <g transform="translate(115, 60)">
      <circle cx="0" cy="0" r="10" fill="#435C4B" opacity="0.25"/>
      <circle cx="0" cy="0" r="5" fill="#435C4B" stroke="#FFF" stroke-width="2"/>
    </g>
    <!-- Label -->
    <text x="16" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#171716">QUAN SÁT THỰC ĐỊA</text>
    <text x="16" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#8C887B">75 ĐIỂM CHẠM MĨ THUẬT</text>
  </g>
  <!-- Flow Connector Curve -->
  <path d="M230 155 C260 155, 260 100, 290 100" stroke="#C89547" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M230 155 C260 155, 260 155, 290 155" stroke="#C46238" stroke-width="2" fill="none"/>
  <path d="M230 155 C260 155, 260 210, 290 210" stroke="#435C4B" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <!-- Right Side: 3-2-1 Stepped Cards -->
  <!-- Card 3 -->
  <g transform="translate(290, 75)">
    <rect width="145" height="50" rx="8" fill="#FFF" stroke="#DCD3C4" stroke-width="1"/>
    <circle cx="24" cy="25" r="14" fill="#171716"/>
    <text x="24" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">3</text>
    <text x="46" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#171716">Điều ấn tượng</text>
    <text x="46" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#8C887B">Đường nét &amp; hoa văn</text>
  </g>
  <!-- Card 2 -->
  <g transform="translate(290, 135)">
    <rect width="145" height="50" rx="8" fill="#FFF" stroke="#DCD3C4" stroke-width="1"/>
    <circle cx="24" cy="25" r="14" fill="#C46238"/>
    <text x="24" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">2</text>
    <text x="46" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#171716">Câu hỏi tò mò</text>
    <text x="46" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#8C887B">Kỹ thuật &amp; lịch sử</text>
  </g>
  <!-- Card 1 -->
  <g transform="translate(290, 195)">
    <rect width="145" height="50" rx="8" fill="#FFF" stroke="#DCD3C4" stroke-width="1"/>
    <circle cx="24" cy="25" r="14" fill="#435C4B"/>
    <text x="24" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">1</text>
    <text x="46" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#171716">Ý tưởng cá nhân</text>
    <text x="46" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#8C887B">Khởi phát tác phẩm</text>
  </g>
</svg>