<svg width="600" height="520" viewBox="0 0 600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect width="600" height="520" rx="20" fill="#FFFDF9" stroke="#E5DFC8" stroke-width="1.5"/>
  
  <!-- Map Container Group -->
  <g transform="translate(30, 20)">
    <text x="10" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#172119" letter-spacing="0.04em">BẢN ĐỒ DI SẢN VĂN HÓA HƯNG YÊN</text>
    <text x="10" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#7A857D">Nhấp vào từng điểm ghim để chọn di sản khám phá</text>

    <!-- Geographic Terrain of Hung Yen & surrounding heritage belt -->
    <!-- Land Mass Background -->
    <path d="M110 90 C125 70, 160 65, 190 75 C220 85, 250 80, 275 110 C295 130, 310 160, 315 200 C320 235, 305 270, 315 295 C325 320, 290 350, 280 380 C270 410, 260 440, 230 460 C200 480, 180 470, 165 445 C150 420, 155 385, 145 365 C135 345, 115 330, 110 300 C105 270, 80 230, 85 185 C90 140, 95 110, 110 90 Z" fill="#F7F2E6" stroke="#D3C7B2" stroke-width="2"/>

    <!-- River Systems (Red River / Song Hong & Song Luoc) -->
    <!-- Red River along western border -->
    <path d="M80 100 Q95 160, 78 220 T110 310 Q120 360, 140 400 T160 460" stroke="#9BBED4" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M80 100 Q95 160, 78 220 T110 310 Q120 360, 140 400 T160 460" stroke="#B8D7EB" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Tributaries / canals inside province -->
    <path d="M150 80 Q160 140, 180 180 T190 270 Q180 320, 160 360" stroke="#B8D7EB" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.7"/>
    <path d="M180 180 Q220 210, 270 230 T310 300" stroke="#B8D7EB" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.7"/>

    <!-- Terrain shading & greenery patches -->
    <path d="M130 110 Q150 100, 170 120 T190 160 Q170 180, 140 170 Z" fill="#E9EFE6" opacity="0.6"/>
    <path d="M180 220 Q210 200, 240 220 T260 260 Q230 280, 200 270 Z" fill="#E9EFE6" opacity="0.6"/>
    <path d="M160 330 Q190 310, 220 330 T240 380 Q210 400, 180 380 Z" fill="#E9EFE6" opacity="0.6"/>

    <!-- County labels (subtle) -->
    <text x="165" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#A49C8C">KHOÁI CHÂU</text>
    <text x="215" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#A49C8C">ÂN THI</text>
    <text x="130" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#A49C8C">KIM ĐỘNG</text>
    <text x="245" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#A49C8C">PHÙ CỪ</text>
    <text x="180" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#A49C8C">TIÊN LỮ</text>

    <!-- 5 INTERACTIVE PINS -->

    <!-- PIN 1: Phố Hiến (Red) -->
    <g class="map-pin-group" id="pin-phohien" style="cursor:pointer;" transform="translate(115, 230)">
      <circle cx="0" cy="0" r="16" fill="#B3261E" opacity="0.2" class="pin-pulse"/>
      <circle cx="0" cy="-5" r="13" fill="#B3261E" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="0" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="0" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#B3261E" text-anchor="middle">Phố Hiến</text>
    </g>

    <!-- PIN 2: Chùa Keo (Orange) -->
    <g class="map-pin-group" id="pin-chuakeo" style="cursor:pointer;" transform="translate(235, 175)">
      <circle cx="0" cy="0" r="16" fill="#D97706" opacity="0.2" class="pin-pulse"/>
      <circle cx="0" cy="-5" r="13" fill="#D97706" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="0" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="0" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#D97706" text-anchor="middle">Chùa Keo</text>
    </g>

    <!-- PIN 3: Đền Trần (Blue) -->
    <g class="map-pin-group" id="pin-dentran" style="cursor:pointer;" transform="translate(265, 290)">
      <circle cx="0" cy="0" r="16" fill="#2563EB" opacity="0.2" class="pin-pulse"/>
      <circle cx="0" cy="-5" r="13" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="0" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="0" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">Đền Trần</text>
    </g>

    <!-- PIN 4: Lê Quý Đôn (Green) -->
    <g class="map-pin-group" id="pin-lequydon" style="cursor:pointer;" transform="translate(125, 400)">
      <circle cx="0" cy="0" r="16" fill="#059669" opacity="0.2" class="pin-pulse"/>
      <circle cx="0" cy="-5" r="13" fill="#059669" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="0" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="0" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">Lê Quý Đôn</text>
    </g>

    <!-- PIN 5: Đồng Xâm (Purple) -->
    <g class="map-pin-group" id="pin-dongxam" style="cursor:pointer;" transform="translate(200, 420)">
      <circle cx="0" cy="0" r="16" fill="#7C3AED" opacity="0.2" class="pin-pulse"/>
      <circle cx="0" cy="-5" r="13" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="0" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
      <text x="0" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#7C3AED" text-anchor="middle">Đồng Xâm</text>
    </g>

    <!-- Compass Rose at bottom right -->
    <g transform="translate(290, 420)">
      <circle cx="0" cy="0" r="18" fill="#FFF" stroke="#D3C7B2" stroke-width="1"/>
      <!-- North point -->
      <polygon points="0,-16 4,0 0,0 -4,0" fill="#172119"/>
      <!-- South point -->
      <polygon points="0,16 4,0 0,0 -4,0" fill="#A49C8C"/>
      <!-- East point -->
      <polygon points="16,0 0,4 0,0 0,-4" fill="#A49C8C"/>
      <!-- West point -->
      <polygon points="-16,0 0,4 0,0 0,-4" fill="#A49C8C"/>
      <text x="0" y="-19" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#172119" text-anchor="middle">B</text>
      <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#7A857D" text-anchor="middle">N</text>
      <text x="24" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#7A857D" text-anchor="middle">Đ</text>
      <text x="-24" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#7A857D" text-anchor="middle">T</text>
    </g>
  </g>

  <!-- Legend Panel (Right Column) -->
  <g transform="translate(380, 50)">
    <rect width="190" height="430" rx="14" fill="#F9F6EE" stroke="#E5DFC8" stroke-width="1"/>
    <text x="16" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#172119">DANH MỤC 5 DI SẢN</text>

    <!-- Item 1 -->
    <g class="map-legend-item" id="leg-phohien" style="cursor:pointer;" transform="translate(16, 50)">
      <circle cx="14" cy="14" r="12" fill="#B3261E"/>
      <text x="14" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">1</text>
      <text x="34" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#172119">Phố Hiến</text>
      <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#7A857D">Đô thị cổ thế kỷ XVII</text>
    </g>

    <!-- Item 2 -->
    <g class="map-legend-item" id="leg-chuakeo" style="cursor:pointer;" transform="translate(16, 120)">
      <circle cx="14" cy="14" r="12" fill="#D97706"/>
      <text x="14" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">2</text>
      <text x="34" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#172119">Chùa Keo</text>
      <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#7A857D">Gác chuông 12 mái cong</text>
    </g>

    <!-- Item 3 -->
    <g class="map-legend-item" id="leg-dentran" style="cursor:pointer;" transform="translate(16, 190)">
      <circle cx="14" cy="14" r="12" fill="#2563EB"/>
      <text x="14" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">3</text>
      <text x="34" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#172119">Đền Trần Hưng Hà</text>
      <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#7A857D">Lăng mộ các vua triều Trần</text>
    </g>

    <!-- Item 4 -->
    <g class="map-legend-item" id="leg-lequydon" style="cursor:pointer;" transform="translate(16, 260)">
      <circle cx="14" cy="14" r="12" fill="#059669"/>
      <text x="14" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">4</text>
      <text x="34" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#172119">Khu lưu niệm Lê Quý Đôn</text>
      <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#7A857D">Nhà bác học thế kỷ XVIII</text>
    </g>

    <!-- Item 5 -->
    <g class="map-legend-item" id="leg-dongxam" style="cursor:pointer;" transform="translate(16, 330)">
      <circle cx="14" cy="14" r="12" fill="#7C3AED"/>
      <text x="14" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">5</text>
      <text x="34" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#172119">Chạm bạc Đồng Xâm</text>
      <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#7A857D">Làng nghề kim hoàn 500 năm</text>
    </g>

    <!-- Help note -->
    <rect x="16" y="385" width="158" height="30" rx="8" fill="#EAF2EC"/>
    <text x="24" y="404" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#173D32">👆 Bấm vào để chọn &amp; xem hồ sơ</text>
  </g>
</svg>